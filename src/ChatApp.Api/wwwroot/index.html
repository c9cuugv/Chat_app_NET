<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Converso</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
</head>
<body>
    <div id="app">
        <!-- Auth Section -->
        <div id="auth-container">
            <div class="auth-scene">
                <div class="auth-left">
                    <div class="brand-block">
                        <div class="brand-mark">C</div>
                        <h1 class="brand-name">Converso</h1>
                        <p class="brand-tagline">Where conversations<br>feel like sitting across<br>the table.</p>
                    </div>
                    <div class="auth-decor">
                        <div class="decor-line"></div>
                        <div class="decor-line"></div>
                        <div class="decor-line"></div>
                    </div>
                </div>
                <div class="auth-right">
                    <div class="auth-card">
                        <div class="auth-card-header">
                            <h2 class="auth-title" id="auth-title-text">Welcome back</h2>
                            <p class="auth-subtitle" id="auth-subtitle-text">Sign in to continue your conversations</p>
                        </div>

                        <div class="tabs">
                            <button id="tab-login" class="tab active">Sign in</button>
                            <button id="tab-register" class="tab">Create account</button>
                            <div class="tab-indicator"></div>
                        </div>

                        <form id="login-form">
                            <div class="field">
                                <label for="login-email">Email</label>
                                <input type="email" id="login-email" placeholder="you@example.com" required autocomplete="email">
                            </div>
                            <div class="field">
                                <label for="login-password">Password</label>
                                <input type="password" id="login-password" placeholder="Your password" required autocomplete="current-password">
                            </div>
                            <button type="submit" class="btn-primary">
                                <span>Sign in</span>
                                <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8h10m0 0L9 4m4 4L9 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            </button>
                        </form>

                        <form id="register-form" class="hidden">
                            <div class="field">
                                <label for="reg-username">Username</label>
                                <input type="text" id="reg-username" placeholder="Pick a name" required autocomplete="username">
                            </div>
                            <div class="field">
                                <label for="reg-email">Email</label>
                                <input type="email" id="reg-email" placeholder="you@example.com" required autocomplete="email">
                            </div>
                            <div class="field">
                                <label for="reg-password">Password</label>
                                <input type="password" id="reg-password" placeholder="6+ characters" required autocomplete="new-password">
                            </div>
                            <button type="submit" class="btn-primary">
                                <span>Create account</span>
                                <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8h10m0 0L9 4m4 4L9 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            </button>
                        </form>

                        <p id="auth-error" class="error-text"></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Chat Section -->
        <div id="chat-container" class="hidden">
            <aside class="sidebar">
                <div class="sidebar-header">
                    <div class="sidebar-brand">
                        <div class="brand-mark small">C</div>
                        <span class="brand-word">Converso</span>
                    </div>
                    <button id="logout-btn" class="btn-ghost" title="Sign out">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    </button>
                </div>

                <div class="sidebar-me">
                    <div class="avatar-me">
                        <span id="current-username-initial"></span>
                    </div>
                    <div class="me-info">
                        <span id="current-username" class="me-name"></span>
                        <span class="me-status">Online</span>
                    </div>
                </div>

                <div class="sidebar-section">
                    <div class="section-label">People</div>
                </div>
                <div id="users-list" class="user-list">
                    <!-- Users will be populated here -->
                </div>

                <div class="sidebar-section">
                    <div class="section-label">Channels</div>
                </div>
                <div id="rooms-list" class="room-list">
                    <!-- Rooms will be populated here -->
                </div>
            </aside>

            <main class="chat-area">
                <div id="no-chat-selected" class="empty-state">
                    <div class="empty-illustration">
                        <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
                            <rect x="8" y="12" width="48" height="36" rx="6" stroke="currentColor" stroke-width="1.5"/>
                            <path d="M8 22h48" stroke="currentColor" stroke-width="1.5"/>
                            <circle cx="16" cy="17" r="2" fill="currentColor" opacity="0.3"/>
                            <circle cx="23" cy="17" r="2" fill="currentColor" opacity="0.3"/>
                            <circle cx="30" cy="17" r="2" fill="currentColor" opacity="0.3"/>
                            <line x1="18" y1="30" x2="36" y2="30" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
                            <line x1="18" y1="36" x2="46" y2="36" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.25"/>
                            <line x1="18" y1="42" x2="30" y2="42" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.15"/>
                        </svg>
                    </div>
                    <p class="empty-title">Pick a conversation</p>
                    <p class="empty-hint">Choose someone from the sidebar to start talking</p>
                </div>

                <div id="active-chat" class="hidden">
                    <header class="chat-header">
                        <div class="chat-header-left">
                            <div class="chat-avatar" id="chat-avatar-initial"></div>
                            <div class="chat-header-info">
                                <h2 id="chat-with-name">Username</h2>
                                <span id="chat-status" class="status-text">Online</span>
                            </div>
                        </div>
                    </header>

                    <div id="messages-container" class="messages-list">
                        <!-- Messages populate here -->
                    </div>

                    <form id="message-form" class="input-area">
                        <input type="text" id="message-input" placeholder="Write something..." autocomplete="off" maxlength="2000">
                        <button type="submit" id="send-btn" title="Send message">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M22 2L11 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M22 2L15 22l-4-9-9-4 20-7z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                        </button>
                    </form>
                </div>
            </main>
        </div>
    </div>
    <script src="chat.js"></script>
</body>
</html>
